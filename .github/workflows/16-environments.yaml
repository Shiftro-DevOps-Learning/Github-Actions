name: 16 - Working with Environments
run-name: 16 - Working with Environments - env - ${{ github.event.inputs.target-env }}

on:
  workflow_dispatch: 
    inputs:
      target-env:
        type: environment
        default: staging
        description: "Select the target environment for deployment"

jobs:
  echo:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target-env }}
    env:
      my-env-value: {{ vars.MY_ENV_VALUE }}
    steps:
      - name: Echo vars
        run: | 
          echo "Env variables: ${{ env.my-env-value }}"
