name: 15 - Working with Matrices
on:
  workflow_dispatch:

jobs:
  backwards-compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: false
        matrix:
          node-version: [18.x, 20.x, 21.x]
          os: 
            - ubuntu-latest
            - windows-latest
          include:
            - os: ubuntu-latest
              node-version: 16.x
            - os: ubuntu-latest
              node-version: 21.x
              tag: experimental
    name: ${{ matrix.os }}-${{ matrix.node-version }}
    steps:
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Perform some tests
        run: |
          echo "Running some tests on ${{ matrix.os }} with node version ${{ matrix.node-version }}"
      - name: Upload test results
        run: | 
          echo "Upload test results"

  include-example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        color: [red, green]
        shape: [circle, square]
        size: [small, large]
        include:
          - color: red
            opacity: 75
          - shape: cicle
            opacity: 100
          - color: red
            shape: triangle
          - opacity: 50
          - color: green
            shape: cicrle
            size: medium
        exclude:
          - color: green
            shape: cicle
    name: ${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}-${{ matrix.opacity }}
    steps:
      - name: Dummy step
        run: | 
          echo "${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}-opacity ${{ matrix.opacity }}"

      
    